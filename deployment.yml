apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapipostgres-app-deployment
  namespace: fastapipostgres-app
  labels:
    app: fastapipostgres-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastapipostgres-app

  template:
    metadata:
      labels:
        app: fastapipostgres-app

    spec:
      enableServiceLinks: false

      containers:
        - name: fastapipostgres-app
          image: imrandocker3656/fastapi3:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8001

          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/zdb"

            - name: REDIS_URL
              value: "redis://redis:6379/0"

          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
